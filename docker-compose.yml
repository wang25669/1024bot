services:
  bot:
    image: ghcr.io/wang25669/1024bot:latest
    pull_policy: always               # 每次 up 自动拉取最新镜像
    container_name: 1024downloader
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ALLOWED_USER_ID=${ALLOWED_USER_ID}
      - DAILY_LIKE_COUNT=${DAILY_LIKE_COUNT:-10}
      - DOWNLOAD_BASE=/downloads
      - OPENLIST_UPLOAD_ENABLED=${OPENLIST_UPLOAD_ENABLED:-false}
      - OPENLIST_URL=${OPENLIST_URL:-}
      - OPENLIST_USERNAME=${OPENLIST_USERNAME:-}
      - OPENLIST_PASSWORD=${OPENLIST_PASSWORD:-}
      - OPENLIST_TARGET_PATH=${OPENLIST_TARGET_PATH:-/移动6611-加密}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DOWNLOAD_PATH:-./download}:/downloads
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
